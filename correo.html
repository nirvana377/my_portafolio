<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Emanuel Martinez</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .gradient-text {
            background: linear-gradient(135deg, #00d4ff 0%, #7000ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .email-container { animation: slideUp 0.8s ease-out; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .copy-btn { transition: all 0.3s ease; }
        .copy-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px -10px rgba(0,212,255,0.4); }
        .copy-btn.copied { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .pulse-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(0,212,255,0.3);
            animation: pulse-ring 2s cubic-bezier(0.215,0.61,0.355,1) infinite;
        }
        @keyframes pulse-ring {
            0%   { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        .social-icon { color: #9ca3af; transition: color 0.2s; }
        .social-icon:hover { color: #00d4ff; }
    </style>
</head>
<body class="relative">

    <!-- Canvas constelaciones -->
    <canvas id="constellation-canvas" style="position:fixed;inset:0;pointer-events:none;z-index:0;"></canvas>
    <!-- Blobs flotantes -->
    <div id="blob1" style="width:480px;height:480px;background:radial-gradient(circle,#00d4ff,transparent 70%);opacity:0.18;filter:blur(90px);position:fixed;border-radius:50%;pointer-events:none;z-index:0;"></div>
    <div id="blob2" style="width:420px;height:420px;background:radial-gradient(circle,#7000ff,transparent 70%);opacity:0.20;filter:blur(90px);position:fixed;border-radius:50%;pointer-events:none;z-index:0;"></div>

    <!-- Back Button -->
    <a href="index.html" class="absolute top-8 left-8 flex items-center gap-2 text-gray-400 hover:text-white transition-colors z-20 group">
        <div class="p-2 glass rounded-full group-hover:bg-white/10 transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        </div>
        <span class="text-sm font-medium">Volver al Portafolio</span>
    </a>

    <!-- Main Content -->
    <div class="relative z-10 w-full max-w-2xl px-4">
        <div class="email-container glass rounded-3xl p-8 md:p-12 text-center border border-white/10" style="box-shadow:0 25px 50px -12px rgba(0,212,255,0.1);">
            
            <!-- Icon -->
            <div class="relative inline-flex mb-8">
                <div class="pulse-ring w-24 h-24 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
                <div class="w-20 h-20 flex items-center justify-center relative z-10 rounded-2xl" style="background:linear-gradient(135deg,#00d4ff,#7000ff);box-shadow:0 10px 30px -10px rgba(0,212,255,0.5);">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-10 h-10 text-white"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                </div>
            </div>

            <!-- Title -->
            <h1 style="font-family:'Space Grotesk',sans-serif;font-size:2.25rem;font-weight:700;margin-bottom:0.5rem;">
                ¿Hablamos?
            </h1>
            <p class="text-gray-400 mb-8">
                Estoy disponible para nuevas oportunidades y proyectos interesantes
            </p>

            <!-- Email Display -->
            <div class="relative mb-8 group">
                <div class="absolute inset-0 rounded-2xl blur-xl opacity-0 group-hover:opacity-100 transition-opacity" style="background:linear-gradient(135deg,rgba(0,212,255,0.2),rgba(112,0,255,0.2));"></div>
                <div class="relative glass rounded-2xl p-6 border border-white/10 group-hover:border-white/30 transition-all">
                    <p class="text-xs text-gray-500 uppercase tracking-wider mb-2">Mi correo electrónico</p>
                    <span class="text-2xl md:text-3xl font-bold gradient-text break-all" style="font-family:'Space Grotesk',sans-serif;">
                        nirvanawork0@gmail.com
                    </span>
                </div>
            </div>

            <!-- Copy Button -->
            <div class="flex justify-center mb-8">
                <button onclick="copyEmail()" id="copy-btn" class="copy-btn px-8 py-4 glass rounded-xl font-semibold text-white hover:bg-white/10 transition-all flex items-center gap-2 border border-white/20">
                    <span id="copy-icon-wrap">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                    </span>
                    <span id="copy-text">Copiar Email</span>
                </button>
            </div>

            <!-- Alternative Methods -->
            <div class="pt-8 border-t border-white/10">
                <p class="text-sm text-gray-500 mb-4">Otras formas de contacto</p>
                <div class="flex justify-center gap-4">
                    <!-- LinkedIn -->
                    <a href="linkedin.html" class="p-3 glass rounded-full transition-all hover:scale-110" style="background:rgba(255,255,255,0.03);" title="LinkedIn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="social-icon w-5 h-5"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                    </a>
                    <!-- GitHub -->
                    <a href="github.html" class="p-3 glass rounded-full transition-all hover:scale-110" title="GitHub">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="social-icon w-5 h-5"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
                    </a>
                    <!-- X / Twitter -->
                    <a href="x.html" class="p-3 glass rounded-full transition-all hover:scale-110" title="Twitter / X">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="social-icon w-5 h-5"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                    </a>
                    <!-- WhatsApp -->
                    <a href="https://wa.me/573113841570" target="_blank" class="p-3 glass rounded-full transition-all hover:scale-110" title="WhatsApp">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="social-icon w-5 h-5"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
                    </a>
                </div>
            </div>

            <!-- Quick Response -->
            <div class="mt-8 flex items-center justify-center gap-2 text-sm text-gray-500">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#00d4ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span>Respuesta usual en menos de 24 horas</span>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-gray-600 text-sm mt-8">
            &copy; 2026 Emanuel Martinez Mena. Todos los derechos reservados.
        </p>
    </div>

    <script>
        const myEmail = "nirvanawork0@gmail.com";

        function copyEmail() {
            const checkSVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><polyline points="20 6 9 17 4 12"/></svg>';
            const copySVG  = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>';

            navigator.clipboard.writeText(myEmail).then(() => {
                const btn  = document.getElementById('copy-btn');
                const wrap = document.getElementById('copy-icon-wrap');
                const text = document.getElementById('copy-text');
                btn.classList.add('copied');
                wrap.innerHTML = checkSVG;
                text.textContent = '¡Copiado!';
                setTimeout(() => {
                    btn.classList.remove('copied');
                    wrap.innerHTML = copySVG;
                    text.textContent = 'Copiar Email';
                }, 2000);
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = myEmail;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                alert('Email copiado: ' + myEmail);
            });
        }

        // ── CONSTELACIONES ──
        (function(){
            const canvas = document.getElementById('constellation-canvas');
            const ctx    = canvas.getContext('2d');
            let W, H, particles = [];
            const N = 70, MAX_DIST = 130, COLORS = ['#00d4ff','#7000ff','#ffffff'];
            function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
            function rand(a,b){ return Math.random()*(b-a)+a; }
            function init(){
                particles = [];
                for(let i=0;i<N;i++) particles.push({
                    x:rand(0,W), y:rand(0,H),
                    vx:rand(-0.2,0.2), vy:rand(-0.2,0.2),
                    r:rand(0.8,2), color:COLORS[Math.floor(Math.random()*3)], alpha:rand(0.35,1)
                });
            }
            function draw(){
                ctx.clearRect(0,0,W,H);
                particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; if(p.x<0)p.x=W; if(p.x>W)p.x=0; if(p.y<0)p.y=H; if(p.y>H)p.y=0; });
                for(let i=0;i<particles.length;i++) for(let j=i+1;j<particles.length;j++){
                    const a=particles[i],b=particles[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy);
                    if(d<MAX_DIST){ ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.strokeStyle=`rgba(0,212,255,${(1-d/MAX_DIST)*0.25})`; ctx.lineWidth=0.5; ctx.stroke(); }
                }
                particles.forEach(p=>{ ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle=p.color; ctx.globalAlpha=p.alpha; ctx.fill(); ctx.globalAlpha=1; });
                requestAnimationFrame(draw);
            }
            window.addEventListener('resize',()=>{ resize(); init(); });
            resize(); init(); draw();
        })();

        // ── BLOBS FLOTANTES ──
        (function(){
            const blobs = [
                {el:document.getElementById('blob1'), x:window.innerWidth*0.1,  y:window.innerHeight*0.1,  vx:0.28, vy:0.20, w:480, h:480},
                {el:document.getElementById('blob2'), x:window.innerWidth*0.75, y:window.innerHeight*0.65, vx:-0.22,vy:-0.17,w:420, h:420}
            ];
            function animate(){
                blobs.forEach(b=>{
                    b.x+=b.vx; b.y+=b.vy;
                    if(b.x<-b.w/2){b.x=-b.w/2;b.vx*=-1;} if(b.x>window.innerWidth -b.w/2){b.x=window.innerWidth -b.w/2;b.vx*=-1;}
                    if(b.y<-b.h/2){b.y=-b.h/2;b.vy*=-1;} if(b.y>window.innerHeight-b.h/2){b.y=window.innerHeight-b.h/2;b.vy*=-1;}
                    b.el.style.left=b.x+'px'; b.el.style.top=b.y+'px';
                });
                requestAnimationFrame(animate);
            }
            blobs.forEach(b=>{ b.el.style.left=b.x+'px'; b.el.style.top=b.y+'px'; });
            animate();
        })();
    </script>
</body>
</html>
