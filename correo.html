<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Tu Nombre</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .gradient-text {
            background: linear-gradient(135deg, #00d4ff 0%, #7000ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .blob {
            position: absolute;
            filter: blur(100px);
            opacity: 0.3;
            animation: float 10s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        .email-container {
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .copy-btn {
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(0, 212, 255, 0.4);
        }

        .copy-btn.copied {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .pulse-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(0, 212, 255, 0.3);
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.3); opacity: 0; }
        }
    </style>
</head>
<body class="relative">

    <!-- Background Effects -->
    <div class="blob bg-primary w-96 h-96 rounded-full top-0 left-0 -translate-x-1/2 -translate-y-1/2" style="background: #00d4ff;"></div>
    <div class="blob bg-secondary w-96 h-96 rounded-full bottom-0 right-0 translate-x-1/2 translate-y-1/2 animation-delay-2000" style="background: #7000ff;"></div>

    <!-- Back Button -->
    <a href="index.html" class="absolute top-8 left-8 flex items-center gap-2 text-gray-400 hover:text-white transition-colors z-20 group">
        <div class="p-2 glass rounded-full group-hover:bg-white/10 transition-all">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </div>
        <span class="text-sm font-medium">Volver al Portafolio</span>
    </a>

    <!-- Main Content -->
    <div class="relative z-10 w-full max-w-2xl px-4">
        <div class="email-container glass rounded-3xl p-8 md:p-12 text-center border border-white/10 shadow-2xl shadow-primary/10">
            
            <!-- Icon -->
            <div class="relative inline-flex mb-8">
                <div class="pulse-ring w-24 h-24 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
                <div class="w-20 h-20 bg-gradient-to-br from-primary to-secondary rounded-2xl flex items-center justify-center shadow-lg shadow-primary/30 relative z-10">
                    <i data-lucide="mail" class="w-10 h-10 text-white"></i>
                </div>
            </div>

            <!-- Title -->
            <h1 class="font-display text-3xl md:text-4xl font-bold mb-2">
                ¿Hablamos?
            </h1>
            <p class="text-gray-400 mb-8">
                Estoy disponible para nuevas oportunidades y proyectos interesantes
            </p>

            <!-- Email Display -->
            <div class="relative mb-8 group">
                <div class="absolute inset-0 bg-gradient-to-r from-primary/20 to-secondary/20 rounded-2xl blur-xl opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="relative glass rounded-2xl p-6 border border-white/10 group-hover:border-primary/30 transition-all">
                    <p class="text-xs text-gray-500 uppercase tracking-wider mb-2">Mi correo electrónico</p>
                    <div class="flex items-center justify-center gap-3 flex-wrap">
                        <span id="email-text" class="text-2xl md:text-3xl font-display font-bold gradient-text break-all">
                            azzz49085@gmail.com
                        </span>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-4 justify-center mb-8">
                <!-- Copy Button -->
                <button onclick="copyEmail()" id="copy-btn" class="copy-btn flex-1 sm:flex-none px-8 py-4 glass rounded-xl font-semibold text-white hover:bg-white/10 transition-all flex items-center justify-center gap-2 border border-white/20">
                    <i data-lucide="copy" class="w-5 h-5" id="copy-icon"></i>
                    <span id="copy-text">Copiar Email</span>
                </button>
            </div>

            <!-- Alternative Methods -->
            <div class="pt-8 border-t border-white/10">
                <p class="text-sm text-gray-500 mb-4">Otras formas de contacto</p>
                <div class="flex justify-center gap-4">
                    <a href="#" class="p-3 glass rounded-full hover:bg-primary/20 transition-all hover:scale-110 group" title="LinkedIn">
                        <i data-lucide="linkedin" class="w-5 h-5 text-gray-400 group-hover:text-primary transition-colors"></i>
                    </a>
                    <a href="#" class="p-3 glass rounded-full hover:bg-primary/20 transition-all hover:scale-110 group" title="GitHub">
                        <i data-lucide="github" class="w-5 h-5 text-gray-400 group-hover:text-primary transition-colors"></i>
                    </a>
                    <a href="#" class="p-3 glass rounded-full hover:bg-primary/20 transition-all hover:scale-110 group" title="Twitter">
                        <i data-lucide="twitter" class="w-5 h-5 text-gray-400 group-hover:text-primary transition-colors"></i>
                    </a>
                    <a href="#" class="p-3 glass rounded-full hover:bg-primary/20 transition-all hover:scale-110 group" title="WhatsApp">
                        <i data-lucide="phone" class="w-5 h-5 text-gray-400 group-hover:text-primary transition-colors"></i>
                    </a>
                </div>
            </div>

            <!-- Quick Response Promise -->
            <div class="mt-8 flex items-center justify-center gap-2 text-sm text-gray-500">
                <i data-lucide="clock" class="w-4 h-4 text-primary"></i>
                <span>Respuesta usual en menos de 24 horas</span>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-gray-600 text-sm mt-8">
            © 2024 Tu Nombre. Todos los derechos reservados.
        </p>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Email Configuration - CAMBIA ESTO CON TU EMAIL REAL
        const myEmail = "azzz49085@gmail.com";

        // Copy to Clipboard Function
        function copyEmail() {
            navigator.clipboard.writeText(myEmail).then(() => {
                const btn = document.getElementById('copy-btn');
                const icon = document.getElementById('copy-icon');
                const text = document.getElementById('copy-text');
                
                // Change to success state
                btn.classList.add('copied');
                icon.setAttribute('data-lucide', 'check');
                text.textContent = '¡Copiado!';
                lucide.createIcons();
                
                // Reset after 2 seconds
                setTimeout(() => {
                    btn.classList.remove('copied');
                    icon.setAttribute('data-lucide', 'copy');
                    text.textContent = 'Copiar Email';
                    lucide.createIcons();
                }, 2000);
            }).catch(err => {
                // Fallback for older browsers
                const textArea = document.createElement("textarea");
                textArea.value = myEmail;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand("copy");
                document.body.removeChild(textArea);
                
                alert('Email copiado: ' + myEmail);
            });
        }

        // Add subtle mouse movement effect to background
        document.addEventListener('mousemove', (e) => {
            const blobs = document.querySelectorAll('.blob');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            blobs.forEach((blob, index) => {
                const speed = (index + 1) * 20;
                const xOffset = (0.5 - x) * speed;
                const yOffset = (0.5 - y) * speed;
                blob.style.transform = `translate(${xOffset}px, ${yOffset}px)`;
            });
        });
    </script>
</body>
</html>
